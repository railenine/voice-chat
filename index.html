<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="no-referrer" />
    <title>RVxis - Голосовой чат</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      :root {
        --bg: oklch(0.15 0.035 255);
        --surface: oklch(0.19 0.035 255);
        --border: oklch(0.31 0.045 250);
        --accent: oklch(0.78 0.14 220);
        --fg: oklch(0.96 0.018 235);
        --muted: oklch(0.72 0.035 245);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: var(--bg);
        color: var(--fg);
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
      }

      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: transparent;
        color: var(--fg);
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #root.app-loaded {
        opacity: 1;
        pointer-events: auto;
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        user-select: none;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
        pointer-events: auto;
      }

      #app-preloader.fade-out {
        opacity: 0;
        transform: scale(1.04);
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes preloader-spin-cw {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes preloader-spin-ccw {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(-360deg);
        }
      }

      .preloader-spin-cw {
        transform-origin: 256px 256px;
        transform-box: view-box;
        animation: preloader-spin-cw 2.4s linear infinite;
      }

      .preloader-spin-ccw {
        transform-origin: 256px 256px;
        transform-box: view-box;
        animation: preloader-spin-ccw 2.4s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-preloader">
      <div style="width: 72px; height: 72px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 512 512" width="72" height="72" fill="none" style="display: block; width: 100%; height: 100%;">
          <!-- Static outer ring -->
          <circle cx="256" cy="256" r="210" stroke="var(--accent)" stroke-width="36" />
          <!-- Outer semicircle rotating clockwise around center (256, 256) -->
          <g class="preloader-spin-cw">
            <path d="M 256 118 A 138 138 0 0 1 256 394" stroke="var(--accent)" stroke-width="34" stroke-linecap="butt" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 256 256"
              to="360 256 256"
              dur="2.4s"
              repeatCount="indefinite"
            />
          </g>
          <!-- Inner semicircle rotating counter-clockwise around center (256, 256) -->
          <g class="preloader-spin-ccw">
            <path d="M 256 184 A 72 72 0 0 1 256 328" stroke="var(--accent)" stroke-width="34" stroke-linecap="butt" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 256 256"
              to="-360 256 256"
              dur="2.4s"
              repeatCount="indefinite"
            />
          </g>
        </svg>
      </div>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); display: flex; align-items: center; gap: 8px;">
        <span>RVxis</span>
      </div>
      <div id="app-preloader-hint" style="display: none; margin-top: 20px; font-size: 13px; color: var(--muted); opacity: 0.9; letter-spacing: 0.01em; cursor: pointer; padding: 6px 14px; border-radius: 9999px; border: 1px solid var(--border); background-color: var(--surface); transition: background-color 0.15s ease;">
        Предпросмотр &bull; Нажмите для входа
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable default WebView2 browser context menu on desktop to prevent hangs
      if (typeof window !== 'undefined') {
        window.addEventListener('contextmenu', function(e) {
          if ('__TAURI_INTERNALS__' in window || '__TAURI__' in window) {
            e.preventDefault();
          }
        }, { capture: true });
      }

      setTimeout(function() {
        var r = document.getElementById('root');
        var urlParams = new URLSearchParams(window.location.search);
        var isHold = urlParams.has('preloader') || urlParams.has('preview-loader') || urlParams.has('debug-preloader');
        if (!isHold && r && !r.classList.contains('app-loaded')) {
          r.classList.add('app-loaded');
          var p = document.getElementById('app-preloader');
          if (p) p.classList.add('fade-out');
        }
      }, 4000);
    </script>
  </body>
</html>
