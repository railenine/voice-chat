<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>VoiceChat - Голосовой чат</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #020617;
        color: #ffffff;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
      }

      @keyframes preloader-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.35;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.65;
        }
      }

      @keyframes preloader-dot {
        0%, 80%, 100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body style="background-color: #020617;">
    <div id="root">
      <div id="app-preloader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: #020617; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; user-select: none;">
        <div style="position: relative; width: 72px; height: 72px; margin-bottom: 18px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -4px; border-radius: 24px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); filter: blur(14px); animation: preloader-pulse 2s infinite ease-in-out;"></div>
          <div style="position: relative; width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </div>
        </div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;">
          <span>VoiceChat</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background-color: #3b82f6; animation: preloader-dot 1.4s infinite ease-in-out both; animation-delay: -0.32s;"></div>
          <div style="width: 7px; height: 7px; border-radius: 50%; background-color: #60a5fa; animation: preloader-dot 1.4s infinite ease-in-out both; animation-delay: -0.16s;"></div>
          <div style="width: 7px; height: 7px; border-radius: 50%; background-color: #93c5fd; animation: preloader-dot 1.4s infinite ease-in-out both;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
