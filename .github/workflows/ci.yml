name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: 🛡️ Automated Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm test

      - name: Validate Update Manifests
        run: node scripts/generate-latest-json.js --validate-only

      - name: Build Web Bundle
        run: npm run build
