name: Build Desktop App (Tauri v2)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Desktop Application (Tauri v2)
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate and Sign latest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/generate-latest-json.js
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChat-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip*
            src-tauri/target/release/bundle/updater/latest.json
            src-tauri/target/release/*.exe
            latest.json
          if-no-files-found: warn

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceChat ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip*
            src-tauri/target/release/bundle/updater/latest.json
            src-tauri/target/release/*.exe
            latest.json

      - name: Commit and push updated latest.json to main
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        run: |
          cp latest.json "$RUNNER_TEMP/latest.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout main
          git pull origin main --rebase
          cp "$RUNNER_TEMP/latest.json" latest.json
          cp "$RUNNER_TEMP/latest.json" server/latest.json
          cp "$RUNNER_TEMP/latest.json" public/api/updater/latest.json
          git add latest.json server/latest.json public/api/updater/latest.json
          git diff --staged --quiet || (git commit -m "chore(updater): auto-update latest.json for ${{ github.ref_name }}" && git push origin main)
