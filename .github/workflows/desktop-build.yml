name: Build Desktop App (Tauri v2)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: 🛡️ Quality Gate (Tests & Validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Install Dependencies
        run: npm ci

      - name: 2. Typecheck
        run: npm run typecheck

      - name: 3. Unit & Integration Tests
        run: npm test

      - name: 4. Build Web Bundle
        run: npm run build

      - name: 5. Manifest Validation
        run: node scripts/generate-latest-json.js --validate-only

  build-windows:
    name: 📦 Build Windows Desktop App
    needs: [quality-gate]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Desktop Application (Tauri v2)
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare Release Binaries (RVxis.exe & backwards-compatible voice-chat.exe)
        shell: bash
        run: |
          # Copy standalone binary to official branded name RVxis.exe while retaining voice-chat.exe alias
          if [ -f "src-tauri/target/release/voice-chat.exe" ]; then
            cp "src-tauri/target/release/voice-chat.exe" "src-tauri/target/release/RVxis.exe"
            echo "Successfully prepared RVxis.exe and voice-chat.exe"
          else
            echo "ERROR: src-tauri/target/release/voice-chat.exe was not generated by build step!"
            exit 1
          fi

      - name: Generate and Sign latest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/generate-latest-json.js
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RVxis-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/RVxis.exe
            src-tauri/target/release/voice-chat.exe
            latest.json
          if-no-files-found: error

      - name: Clean up pre-existing release draft for tag if any
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release exists before attempting deletion to avoid silent failure masks
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "Existing release found for ${{ github.ref_name }}, deleting prior release to recreate..."
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "No existing release found for ${{ github.ref_name }}, continuing..."
          fi

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RVxis ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/RVxis.exe
            src-tauri/target/release/voice-chat.exe
            latest.json
