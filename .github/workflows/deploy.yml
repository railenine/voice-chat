name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Validate Update Manifests
        run: node scripts/generate-latest-json.js --validate-only

      - name: Build frontend
        run: npm run build

      - name: Install browser for media smoke test
        run: npx playwright-core install --with-deps chromium

      - name: Browser media smoke test
        run: npm run test:browser

      - name: Upload release candidate
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/,package.json,package-lock.json,server/,scripts/"
          target: "/var/www/voice-chat-releases/${{ github.sha }}"
          overwrite: true

      - name: Verify and activate candidate
        uses: appleboy/ssh-action@v1.0.3
        env:
          RVXIS_RELEASE: ${{ github.sha }}
          RVXIS_FRONTEND: ${{ secrets.TARGET_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: RVXIS_RELEASE,RVXIS_FRONTEND
          script: |
            export PATH="/opt/rvxis-runtime/current/bin:$PATH"
            bash "/var/www/voice-chat-releases/$RVXIS_RELEASE/scripts/deploy-candidate.sh"
